services:
  chronoframe:
    build: .
    restart: unless-stopped
    ports:
      - '127.0.0.1:3000:3000'
    env_file: .env
    environment:
      NODE_ENV: production
      NUXT_STORAGE_DRIVER: s3
    read_only: true
    tmpfs:
      - /tmp:uid=65532,gid=65532,mode=1777
      - /app/data:uid=65532,gid=65532,mode=0700
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 120s
