# Local development only. The database port is restricted to loopback.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: chronoframe
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-dev:/var/lib/postgresql/data
volumes:
  postgres-dev:
